name: Build and Audio Test

on:
  push:
    paths-ignore:
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Solo-build: include [job-name] in commit message to run only that job
# e.g. "[linux-html5]" runs only the linux-html5 job
# [skip-build] skips all jobs

env:
  HAXE_VERSION: 4.3.6
  HAXEFMOD_BRANCH: hashlink-refactor
  HAXEFMOD_REPO: https://github.com/Tanz0rz/haxe-fmod.git
  FMOD_SDK: ${{ github.workspace }}/fmod-sdk

jobs:
  # ===========================================================================
  # Linux C++ Build + Audio Recording
  # ===========================================================================
  linux-cpp:
    runs-on: ubuntu-latest
    #if: false  # Disabled - will re-enable later
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        env:
          GH_TOKEN: ${{ secrets.FMOD_SDK_TOKEN }}
        run: |
          mkdir -p "$FMOD_SDK"
          echo "Downloading FMOD SDK for Linux..."
          gh release download 2.03.12 \
            --repo Tanz0rz/fmod-sdk-cache \
            --pattern "fmod-sdk-linux-2.03.12.tar.gz" \
            --dir /tmp || { echo "ERROR: SDK download failed"; exit 1; }
          echo "Extracting SDK..."
          tar -xzf /tmp/fmod-sdk-linux-2.03.12.tar.gz -C "$FMOD_SDK" || { echo "ERROR: SDK extraction failed"; exit 1; }
          echo "SDK ready"
          ls -la "$FMOD_SDK/api/core/inc/" | head -3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ env.HAXEFMOD_BRANCH }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          ./setup.sh ${{ env.HAXEFMOD_BRANCH }}

      - name: Install system dependencies
        run: |
          echo ">>> Updating apt..."
          sudo apt-get update
          echo ">>> Installing pulseaudio, ffmpeg, patchelf, etc..."
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg patchelf libgl1-mesa-dev

      - name: Build C++ target
        run: |
          echo ">>> Building C++ linux target..."
          haxelib run lime build linux -64

      - name: Patch FMOD libraries
        run: |
          BIN_DIR="export/linux64/bin"
          if [ ! -d "$BIN_DIR" ]; then
            BIN_DIR="export/linux/bin"
          fi
          echo ">>> Patching FMOD libraries in $BIN_DIR..."
          patchelf --clear-execstack "$BIN_DIR"/libfmod.so* || true
          patchelf --clear-execstack "$BIN_DIR"/libfmodstudio.so* || true

      - name: Validate build output
        run: |
          BIN_DIR="export/linux64/bin"
          if [ ! -d "$BIN_DIR" ]; then
            BIN_DIR="export/linux/bin"
          fi
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          echo ">>> Validating build output in $BIN_DIR..."
          ./ci/validate-build.sh "$BIN_DIR" cpp

      - name: Record audio
        run: |
          echo ">>> Starting Xvfb virtual display..."
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1

          echo ">>> Starting PulseAudio with virtual sink..."
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker

          echo ">>> Configuring ALSA to route through PulseAudio..."
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF

          echo ">>> Starting ffmpeg recording from virtual sink..."
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-linux-cpp.wav &
          RECORD_PID=$!

          echo ">>> Running game executable..."
          cd "$BIN_DIR"
          chmod +x run.sh
          timeout 30 ./run.sh > /tmp/game-linux-cpp.log 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat /tmp/game-linux-cpp.log || true
          echo "=== End game log ==="

          echo ">>> Waiting for recording to finish..."
          wait $RECORD_PID || true

          if [ -f /tmp/audio-linux-cpp.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-linux-cpp.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: |
          echo ">>> Validating audio file..."
          ./ci/validate-audio.sh /tmp/audio-linux-cpp.wav 10

      - name: Validate game log
        run: |
          echo ">>> Validating game log..."
          ./ci/validate-game-log.sh /tmp/game-linux-cpp.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-linux-cpp
          path: |
            /tmp/audio-linux-cpp.wav
            /tmp/game-linux-cpp.log
          if-no-files-found: warn

  # ===========================================================================
  # Linux HashLink Build + Audio Recording
  # ===========================================================================
  linux-hl:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[linux-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]'))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        env:
          GH_TOKEN: ${{ secrets.FMOD_SDK_TOKEN }}
        run: |
          mkdir -p "$FMOD_SDK"

          # Get asset ID dynamically from release tag
          ASSET_ID=$(gh api repos/Tanz0rz/fmod-sdk-cache/releases/tags/2.03.12 \
            --jq '.assets[] | select(.name == "fmod-sdk-linux-2.03.12.tar.gz") | .id')

          echo "Downloading fmod-sdk-linux-2.03.12.tar.gz (asset ID: $ASSET_ID)"

          curl -L \
            -H "Authorization: token ${{ secrets.FMOD_SDK_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/fmod-sdk-linux-2.03.12.tar.gz \
            "https://api.github.com/repos/Tanz0rz/fmod-sdk-cache/releases/assets/$ASSET_ID"

          tar -xzf /tmp/fmod-sdk-linux-2.03.12.tar.gz -C "$FMOD_SDK"
          ls -la "$FMOD_SDK/api/core/inc/" | head -5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ env.HAXEFMOD_BRANCH }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          ./setup.sh ${{ env.HAXEFMOD_BRANCH }}

      - name: Install system dependencies
        run: |
          echo ">>> Updating apt..."
          sudo apt-get update
          echo ">>> Installing pulseaudio, ffmpeg, patchelf, hashlink deps..."
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg patchelf \
            libpng-dev libturbojpeg0-dev libsdl2-dev libgl1-mesa-dev \
            libopenal-dev libmbedtls-dev libuv1-dev libvorbis-dev libsqlite3-dev libz-dev

      - name: Build and install HashLink
        run: |
          echo ">>> Cloning HashLink source..."
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink-src
          cd /tmp/hashlink-src
          echo ">>> Building HashLink (parallel)..."
          make -j$(nproc) 2>&1 | tee /tmp/hashlink-build.log || {
            echo "=== MAKE FAILED - retrying single-threaded ==="
            make 2>&1 | tee -a /tmp/hashlink-build.log
            exit 1
          }
          echo ">>> Installing HashLink..."
          sudo make install
          sudo ldconfig
          hl --version || echo "HashLink installed"

      - name: Build HashLink target
        run: |
          echo ">>> Building HashLink target..."
          haxelib run lime build hl

      - name: Patch FMOD libraries
        run: |
          BIN_DIR="export/hl/bin"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          echo ">>> Patching FMOD libraries in $BIN_DIR..."
          patchelf --clear-execstack "$BIN_DIR"/libfmod.so* || true
          patchelf --clear-execstack "$BIN_DIR"/libfmodstudio.so* || true

      - name: Validate build output
        run: |
          echo ">>> Validating build output..."
          ./ci/validate-build.sh "$BIN_DIR" hl

      - name: Record audio
        run: |
          echo ">>> Starting Xvfb virtual display..."
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1

          echo ">>> Starting PulseAudio with virtual sink..."
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker

          echo ">>> Configuring ALSA to route through PulseAudio..."
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF

          BIN_DIR="export/hl/bin"

          echo ">>> Creating .so symlinks..."
          cd "$BIN_DIR"
          ln -sf libfmod.so.11 libfmod.so 2>/dev/null || true
          ln -sf libfmodstudio.so.11 libfmodstudio.so 2>/dev/null || true
          cd -

          echo ">>> Starting ffmpeg recording from virtual sink..."
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-linux-hl.wav &
          RECORD_PID=$!

          echo ">>> Finding and running game executable..."
          cd "$BIN_DIR"
          EXE=$(find . -maxdepth 1 -type f -executable ! -name "*.so*" ! -name "*.hdll" ! -name "run.sh" -print -quit)
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          chmod +x "$EXE"
          echo ">>> Running $EXE..."
          timeout 30 "$EXE" > /tmp/game-linux-hl.log 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat /tmp/game-linux-hl.log || true
          echo "=== End game log ==="

          echo ">>> Waiting for recording to finish..."
          wait $RECORD_PID || true

          if [ -f /tmp/audio-linux-hl.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-linux-hl.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: |
          echo ">>> Validating audio file..."
          ./ci/validate-audio.sh /tmp/audio-linux-hl.wav 10

      - name: Validate game log
        run: |
          echo ">>> Validating game log..."
          ./ci/validate-game-log.sh /tmp/game-linux-hl.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-linux-hl
          path: |
            /tmp/audio-linux-hl.wav
            /tmp/game-linux-hl.log
          if-no-files-found: warn

  # ===========================================================================
  # Linux HTML5 Build + Audio Recording via Browser
  # ===========================================================================
  linux-html5:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[linux-html5]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]'))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        env:
          GH_TOKEN: ${{ secrets.FMOD_SDK_TOKEN }}
        run: |
          mkdir -p "$FMOD_SDK"

          # Get asset ID dynamically from release tag
          ASSET_ID=$(gh api repos/Tanz0rz/fmod-sdk-cache/releases/tags/2.03.12 \
            --jq '.assets[] | select(.name == "fmod-sdk-html5-2.03.12.zip") | .id')

          echo "Downloading fmod-sdk-html5-2.03.12.zip (asset ID: $ASSET_ID)"

          curl -L \
            -H "Authorization: token ${{ secrets.FMOD_SDK_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/fmod-sdk-html5-2.03.12.zip \
            "https://api.github.com/repos/Tanz0rz/fmod-sdk-cache/releases/assets/$ASSET_ID"

          unzip -q /tmp/fmod-sdk-html5-2.03.12.zip -d "$FMOD_SDK"
          ls -la "$FMOD_SDK/api/studio/lib/wasm/" | head -5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-html5-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ env.HAXEFMOD_BRANCH }}

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          ./setup.sh ${{ env.HAXEFMOD_BRANCH }}

      - name: Install system dependencies
        run: |
          echo ">>> Updating apt..."
          sudo apt-get update
          echo ">>> Installing pulseaudio, ffmpeg, chromium, xdotool..."
          sudo apt-get install -y pulseaudio libasound2-plugins xvfb ffmpeg chromium-browser xdotool

      - name: Build HTML5 target
        env:
          FMOD_SDK_WEB: ${{ env.FMOD_SDK }}
        run: |
          echo ">>> Building HTML5 target..."
          haxelib run lime build html5

      - name: Record audio
        run: |
          echo ">>> Starting Xvfb virtual display..."
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 1

          echo ">>> Starting PulseAudio with virtual sink..."
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description=VirtualSpeaker
          pactl set-default-sink virtual_speaker

          echo ">>> Configuring ALSA to route through PulseAudio..."
          cat > ~/.asoundrc << 'ALSA_EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          ALSA_EOF

          echo ">>> Starting HTTP server for HTML5 build..."
          cd export/html5/bin
          python3 -m http.server 8080 &
          HTTP_PID=$!
          cd -
          sleep 1

          echo ">>> Launching Chromium with autoplay enabled..."
          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --window-size=640,480 \
            --window-position=0,0 \
            http://localhost:8080 &
          CHROME_PID=$!
          sleep 3

          echo ">>> Clicking browser window for focus..."
          xdotool mousemove 320 240 click 1
          sleep 1

          echo ">>> Starting ffmpeg recording from virtual sink..."
          ffmpeg -f pulse -i virtual_speaker.monitor -t 30 -y /tmp/audio-html5.wav &
          RECORD_PID=$!

          echo ">>> Waiting 31s for recording to complete..."
          sleep 31

          echo ">>> Stopping Chromium and HTTP server..."
          kill $CHROME_PID || true
          kill $HTTP_PID || true
          echo ">>> Waiting for recording to finish..."
          wait $RECORD_PID || true

          if [ -f /tmp/audio-html5.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-html5.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: |
          echo ">>> Validating audio file..."
          ./ci/validate-audio.sh /tmp/audio-html5.wav 10

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-html5
          path: /tmp/audio-html5.wav
          if-no-files-found: warn

  # ===========================================================================
  # macOS C++ Build + Audio Recording
  # ===========================================================================
  mac-cpp:
    runs-on: macos-14
    #if: false  # Disabled - will re-enable later
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        env:
          GH_TOKEN: ${{ secrets.FMOD_SDK_TOKEN }}
        run: |
          mkdir -p "$FMOD_SDK"
          echo "Downloading FMOD SDK for Mac..."
          gh release download 2.03.12 \
            --repo Tanz0rz/fmod-sdk-cache \
            --pattern "fmod-sdk-mac-2.03.12.tar.gz" \
            --dir /tmp || { echo "ERROR: SDK download failed"; exit 1; }
          echo "Extracting SDK..."
          tar -xzf /tmp/fmod-sdk-mac-2.03.12.tar.gz -C "$FMOD_SDK" || { echo "ERROR: SDK extraction failed"; exit 1; }
          echo "SDK ready"

      - name: Setup Haxe via Homebrew
        run: |
          echo ">>> Installing haxe, neko, ffmpeg via homebrew..."
          brew install haxe neko ffmpeg
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ env.HAXEFMOD_BRANCH }}

      - name: Install Haxe libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          ./setup.sh ${{ env.HAXEFMOD_BRANCH }}

      - name: Build C++ target
        run: |
          echo ">>> Building C++ mac target..."
          haxelib run lime build mac -64

      - name: Validate build output
        run: |
          echo ">>> Finding .app bundle..."
          APP_BUNDLE=$(find export -name "*.app" -path "*mac*" 2>/dev/null | head -1)
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
          echo ">>> Validating build output in $APP_BUNDLE/Contents/MacOS..."
          ./ci/validate-build.sh "$APP_BUNDLE/Contents/MacOS" cpp

      - name: Record audio via FMOD wavwriter
        run: |
          echo ">>> Found app: $APP_BUNDLE"
          export FMOD_WAVWRITER=/tmp/audio-mac-cpp.wav

          echo ">>> Running game with FMOD wavwriter..."
          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/game-mac-cpp.log 2>&1 &
          GAME_PID=$!
          echo ">>> Waiting for game (PID $GAME_PID) to finish (max 60s)..."
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          echo ">>> Killing game process..."
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          echo "=== Game log ==="
          cat /tmp/game-mac-cpp.log || true
          echo "=== End game log ==="

          if [ -f /tmp/audio-mac-cpp.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-mac-cpp.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: |
          echo ">>> Validating audio file..."
          ./ci/validate-audio.sh /tmp/audio-mac-cpp.wav 10

      - name: Validate game log
        run: |
          echo ">>> Validating game log..."
          ./ci/validate-game-log.sh /tmp/game-mac-cpp.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-mac-cpp
          path: |
            /tmp/audio-mac-cpp.wav
            /tmp/game-mac-cpp.log
          if-no-files-found: warn

  # ===========================================================================
  # macOS HashLink Build + Audio Recording
  # ===========================================================================
  mac-hl:
    runs-on: macos-14
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[mac-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]'))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        env:
          GH_TOKEN: ${{ secrets.FMOD_SDK_TOKEN }}
        run: |
          mkdir -p "$FMOD_SDK"

          # Get asset ID dynamically from release tag
          ASSET_ID=$(gh api repos/Tanz0rz/fmod-sdk-cache/releases/tags/2.03.12 \
            --jq '.assets[] | select(.name == "fmod-sdk-mac-2.03.12.tar.gz") | .id')

          echo "Downloading fmod-sdk-mac-2.03.12.tar.gz (asset ID: $ASSET_ID)"

          curl -L \
            -H "Authorization: token ${{ secrets.FMOD_SDK_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/fmod-sdk-mac-2.03.12.tar.gz \
            "https://api.github.com/repos/Tanz0rz/fmod-sdk-cache/releases/assets/$ASSET_ID"

          tar -xzf /tmp/fmod-sdk-mac-2.03.12.tar.gz -C "$FMOD_SDK"
          echo "FMOD SDK contents:"
          ls -R "$FMOD_SDK/api/" | head -20

      - name: Setup Haxe via Homebrew
        run: |
          echo ">>> Installing haxe, neko, hashlink, ffmpeg via homebrew..."
          brew install haxe neko hashlink ffmpeg
          echo "HAXE_STD_PATH=$(brew --prefix)/lib/haxe/std" >> $GITHUB_ENV

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ env.HAXEFMOD_BRANCH }}

      - name: Install Haxe libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          ./setup.sh ${{ env.HAXEFMOD_BRANCH }}

      - name: Build HashLink target
        run: |
          echo ">>> Building HashLink target..."
          haxelib run lime build hl

      - name: Validate build output
        run: |
          echo ">>> Finding .app bundle..."
          APP_BUNDLE=$(find export/hl -name "*.app" 2>/dev/null | head -1)
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"
          echo ">>> Validating build output in $APP_BUNDLE/Contents/MacOS..."
          ./ci/validate-build.sh "$APP_BUNDLE/Contents/MacOS" hl

      - name: Record audio via FMOD wavwriter
        run: |
          echo ">>> Found app: $APP_BUNDLE"
          export FMOD_WAVWRITER=/tmp/audio-mac-hl.wav

          echo ">>> Running game with FMOD wavwriter..."
          "$APP_BUNDLE/Contents/MacOS/"* > /tmp/game-mac-hl.log 2>&1 &
          GAME_PID=$!
          echo ">>> Waiting for game (PID $GAME_PID) to finish (max 60s)..."
          for i in $(seq 60); do
            kill -0 $GAME_PID 2>/dev/null || break
            sleep 1
          done
          echo ">>> Killing game process..."
          kill $GAME_PID 2>/dev/null || true
          wait $GAME_PID 2>/dev/null || true

          echo "=== Game log ==="
          cat /tmp/game-mac-hl.log || true
          echo "=== End game log ==="

          if [ -f /tmp/audio-mac-hl.wav ]; then
            echo "Audio recorded successfully"
            ls -la /tmp/audio-mac-hl.wav
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Validate audio
        run: |
          echo ">>> Validating audio file..."
          ./ci/validate-audio.sh /tmp/audio-mac-hl.wav 10

      - name: Validate game log
        run: |
          echo ">>> Validating game log..."
          ./ci/validate-game-log.sh /tmp/game-mac-hl.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-mac-hl
          path: |
            /tmp/audio-mac-hl.wav
            /tmp/game-mac-hl.log
          if-no-files-found: warn

  # ===========================================================================
  # Windows C++ Build + Audio Recording
  # ===========================================================================
  windows-cpp:
    runs-on: windows-latest
    #if: false  # Disabled - will re-enable later
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        env:
          GH_TOKEN: ${{ secrets.FMOD_SDK_TOKEN }}
        run: |
          mkdir -p "$FMOD_SDK"
          echo "Downloading FMOD SDK for Windows..."
          gh release download 2.03.12 \
            --repo Tanz0rz/fmod-sdk-cache \
            --pattern "fmod-sdk-windows-2.03.12.zip" \
            --dir /tmp || { echo "ERROR: SDK download failed"; exit 1; }
          echo "Extracting SDK..."
          unzip -q /tmp/fmod-sdk-windows-2.03.12.zip -d "$FMOD_SDK" || { echo "ERROR: SDK extraction failed"; exit 1; }
          echo "SDK ready"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Add ffmpeg to PATH
        run: |
          echo ">>> Adding ffmpeg to PATH..."
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
          for d in /c/ProgramData/chocolatey/lib/ffmpeg/tools/*/bin; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
          done
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          echo ">>> Checking ffprobe..."
          ffprobe -version | head -1 || echo "WARNING: ffprobe not found yet"

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-cpp-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ env.HAXEFMOD_BRANCH }}

      - name: Install Haxe libraries
        shell: cmd
        run: |
          haxelib setup %USERPROFILE%\haxelib
          call setup.cmd %HAXEFMOD_BRANCH%

      - name: Build C++ target
        run: |
          echo ">>> Building C++ windows target..."
          haxelib run lime build windows -64

      - name: Validate build output
        run: |
          echo ">>> Finding bin directory..."
          BIN_DIR=$(find export -type d -name "bin" -path "*windows*" | head -1)
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          echo ">>> Validating build output in $BIN_DIR..."
          ./ci/validate-build.sh "$BIN_DIR" cpp

      - name: Record audio via FMOD wavwriter
        run: |
          echo ">>> Finding game executable..."
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo ">>> Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-cpp.wav"

          echo ">>> Running game with FMOD wavwriter..."
          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-cpp.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-cpp.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-cpp.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-cpp.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-cpp.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: |
          echo ">>> Validating audio file..."
          ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-cpp.wav" 10

      - name: Validate game log
        run: |
          echo ">>> Validating game log..."
          ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-cpp.log"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-windows-cpp
          path: |
            audio-windows-cpp.wav
            game-windows-cpp.log
          if-no-files-found: warn

  # ===========================================================================
  # Windows HashLink Build + Audio Recording
  # ===========================================================================
  windows-hl:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') && (contains(github.event.head_commit.message, '[windows-hl]') || (!contains(github.event.head_commit.message, '[linux-cpp]') && !contains(github.event.head_commit.message, '[linux-hl]') && !contains(github.event.head_commit.message, '[linux-html5]') && !contains(github.event.head_commit.message, '[mac-cpp]') && !contains(github.event.head_commit.message, '[mac-hl]') && !contains(github.event.head_commit.message, '[windows-cpp]') && !contains(github.event.head_commit.message, '[windows-hl]'))) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download FMOD SDK
        env:
          GH_TOKEN: ${{ secrets.FMOD_SDK_TOKEN }}
        run: |
          mkdir -p "$FMOD_SDK"

          # Get asset ID dynamically from release tag
          ASSET_ID=$(gh api repos/Tanz0rz/fmod-sdk-cache/releases/tags/2.03.12 \
            --jq '.assets[] | select(.name == "fmod-sdk-windows-2.03.12.zip") | .id')

          echo "Downloading fmod-sdk-windows-2.03.12.zip (asset ID: $ASSET_ID)"

          curl -L \
            -H "Authorization: token ${{ secrets.FMOD_SDK_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/fmod-sdk-windows-2.03.12.zip \
            "https://api.github.com/repos/Tanz0rz/fmod-sdk-cache/releases/assets/$ASSET_ID"

          unzip -q /tmp/fmod-sdk-windows-2.03.12.zip -d "$FMOD_SDK"
          ls -la "$FMOD_SDK/api/core/inc/" | head -5

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install ffmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Add ffmpeg to PATH
        run: |
          echo ">>> Adding ffmpeg to PATH..."
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"
          for d in /c/ProgramData/chocolatey/lib/ffmpeg/tools/*/bin; do
            [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
          done
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          echo ">>> Checking ffprobe..."
          ffprobe -version | head -1 || echo "WARNING: ffprobe not found yet"

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-hl-${{ runner.os }}-${{ env.HAXE_VERSION }}-${{ env.HAXEFMOD_BRANCH }}

      - name: Install Haxe libraries
        shell: cmd
        run: |
          haxelib setup %USERPROFILE%\haxelib
          call setup.cmd %HAXEFMOD_BRANCH%

      - name: Build and install HashLink
        shell: powershell
        run: |
          Write-Host ">>> Downloading HashLink 1.14..."
          $HL_URL = "https://github.com/HaxeFoundation/hashlink/releases/download/1.14/hashlink-1.14.0-win.zip"
          Invoke-WebRequest -Uri $HL_URL -OutFile "C:\hashlink.zip"
          Write-Host ">>> Extracting HashLink..."
          Expand-Archive -Path "C:\hashlink.zip" -DestinationPath "C:\"
          $HL_DIR = Get-ChildItem "C:\" -Directory | Where-Object { $_.Name -like "hashlink*" } | Select-Object -First 1
          Rename-Item $HL_DIR.FullName "C:\hashlink"
          Write-Host ">>> Adding HashLink to PATH..."
          echo "C:\hashlink" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "HASHLINK_DIR=C:\hashlink" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build HashLink target
        run: |
          echo ">>> Building HashLink target..."
          haxelib run lime build hl

      - name: Validate build output
        run: |
          BIN_DIR="export/hl/bin"
          echo "BIN_DIR=$BIN_DIR" >> "$GITHUB_ENV"
          echo ">>> Validating build output in $BIN_DIR..."
          ./ci/validate-build.sh "$BIN_DIR" hl

      - name: Record audio via FMOD wavwriter
        run: |
          echo ">>> Finding game executable..."
          EXE=$(find "$BIN_DIR" -maxdepth 1 -name "*.exe" | head -1)
          echo ">>> Found exe: $EXE"

          export FMOD_WAVWRITER="$GITHUB_WORKSPACE/audio-windows-hl.wav"

          echo ">>> Running game with FMOD wavwriter..."
          cd "$BIN_DIR"
          timeout 60 "./$(basename "$EXE")" > "$GITHUB_WORKSPACE/game-windows-hl.log" 2>&1 || true
          cd -

          echo "=== Game log ==="
          cat "$GITHUB_WORKSPACE/game-windows-hl.log" || true
          echo "=== End game log ==="

          if [ -f "$GITHUB_WORKSPACE/audio-windows-hl.wav" ]; then
            echo "Audio recorded successfully"
            ls -la "$GITHUB_WORKSPACE/audio-windows-hl.wav"
          else
            echo "WARNING: No audio file produced"
          fi

      - name: Fix WAV header
        shell: python
        run: |
          import struct, os
          wav = os.path.join(os.environ['GITHUB_WORKSPACE'], 'audio-windows-hl.wav')
          if os.path.exists(wav):
              with open(wav, 'r+b') as f:
                  f.seek(22)
                  num_channels = struct.unpack('<H', f.read(2))[0]
                  if num_channels == 0:
                      print(f"Fixing WAV header: 0 channels -> 2 channels (stereo)")
                      f.seek(22)
                      f.write(struct.pack('<H', 2))
                      f.seek(28)
                      f.write(struct.pack('<I', 192000))
                      f.write(struct.pack('<H', 4))
                      print("WAV header fixed")
                  else:
                      print(f"WAV header OK ({num_channels} channels)")
          else:
              print(f"WAV file not found: {wav}")

      - name: Validate audio
        run: |
          echo ">>> Validating audio file..."
          ./ci/validate-audio.sh "$GITHUB_WORKSPACE/audio-windows-hl.wav" 10

      - name: Validate game log
        run: |
          echo ">>> Validating game log..."
          ./ci/validate-game-log.sh "$GITHUB_WORKSPACE/game-windows-hl.log"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-windows-hl
          path: |
            audio-windows-hl.wav
            game-windows-hl.log
          if-no-files-found: warn
